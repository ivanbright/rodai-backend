services:
  rodai-db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: rodai
      POSTGRES_USER: rodai
      POSTGRES_PASSWORD: rodai-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rodai -d rodai"]
      interval: 5s
      timeout: 3s
      retries: 20

  rodai-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RODAI_ENV: ${RODAI_ENV:-local}
      RODAI_DATA_DIR: ${RODAI_DATA_DIR:-/var/lib/rodai}
      RODAI_MODEL_DIR: ${RODAI_MODEL_DIR:-/var/lib/rodai/models}
      RODAI_SECRET_KEY: ${RODAI_SECRET_KEY:-local-development-only-change-before-deploy}
      RODAI_MAX_UPLOAD_MB: ${RODAI_MAX_UPLOAD_MB:-500}
      RODAI_MAX_VIDEO_SECONDS: ${RODAI_MAX_VIDEO_SECONDS:-600}
      RODAI_MAX_CONCURRENT_SESSIONS: ${RODAI_MAX_CONCURRENT_SESSIONS:-1}
      RODAI_DEVICE: ${RODAI_DEVICE:-cpu}
      RODAI_DETECTION_MODEL: ${RODAI_DETECTION_MODEL:-facebook/detr-resnet-50}
      RODAI_DETECTION_MODEL_REVISION: ${RODAI_DETECTION_MODEL_REVISION:-70120ba84d68ca1211e007c4fb61d0cd5424be54}
      RODAI_INFERENCE_IMGSZ: ${RODAI_INFERENCE_IMGSZ:-640}
      RODAI_ANALYSIS_FPS: ${RODAI_ANALYSIS_FPS:-2}
      RODAI_LOG_LEVEL: ${RODAI_LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://rodai:rodai-local-only@rodai-db:5432/rodai
      RODAI_ALLOWED_ORIGINS: '${RODAI_ALLOWED_ORIGINS:-["http://localhost:5173"]}'
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - rodai_data:/var/lib/rodai
    depends_on:
      rodai-db:
        condition: service_healthy

  rodai-frontend:
    image: node:22.13.1-alpine3.21
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://rodai-api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      rodai-api:
        condition: service_healthy

volumes:
  postgres_data:
  rodai_data:
  frontend_node_modules:
