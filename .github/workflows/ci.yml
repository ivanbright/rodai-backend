name: RodAI integrated CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out with frontend submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and development tools
        run: python -m pip install -e 'backend[dev]'
      - name: Lint backend
        run: ruff check backend/rodai backend/migrations backend/tests
      - name: Test backend
        run: pytest -q backend/tests

  container-build:
    name: Build integrated Docker image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Check out with frontend submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build container
        run: docker build --pull --tag rodai:ci --file backend/Dockerfile .
